version: "3.9"

services:
  devopsdb:
    image: sushmatt/manual:db
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  application:
    image: sushmatt/manual:app
    ports:
      - "6699:8080"
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
