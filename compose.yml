version: "3.9"

services:
  devopsdb:
    image: sushmatt/automation:mydb
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
    networks:
      - mynetwork

  application:
    image: sushmatt/automation:myapp
    ports:
      - "6699:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
